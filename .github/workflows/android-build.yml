name: Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'Baudetail-0.3.2-Projekt.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Baudetail project
        run: unzip -q Baudetail-0.3.2-Projekt.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/Baudetail-0.3.2-work
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baudetail-0.3.2-debug
          path: build-src/Baudetail-0.3.2-work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
