name: Android Build 0.5.2

on:
  workflow_dispatch:
  push:
    paths:
      - 'Baudetail-0.5.2*.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract Baudetail project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Baudetail-0.5.2*.zip' | head -n 1)
          echo "ZIP gefunden: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-src

      - name: Find project directory
        run: |
          PROJECT_DIR=$(find build-src -name gradlew -type f -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Projekt gefunden unter: $PROJECT_DIR"
          test -n "$PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baudetail-0.5.2-debug
          path: build-src/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
