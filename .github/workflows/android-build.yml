
name: Build Baudetail APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Baudetail-*-Projekt.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Java 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Neueste Baudetail-Version ermitteln
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Baudetail-*-Projekt.zip' \
            | sed 's#^\./##' \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "FEHLER: Keine Baudetail-Projekt-ZIP gefunden."
            exit 1
          fi

          VERSION=$(echo "$ZIP" \
            | sed -E 's/^Baudetail-([0-9]+\.[0-9]+\.[0-9]+)-Projekt\.zip$/\1/')

          if [ -z "$VERSION" ] || [ "$VERSION" = "$ZIP" ]; then
            echo "FEHLER: Versionsnummer konnte nicht ermittelt werden."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Gefundene Version: $VERSION"

      - name: Projekt entpacken
        shell: bash
        run: |
          mkdir -p build-project
          unzip -q "$ZIP" -d build-project
          ls -la build-project

      - name: Gradle-Projekt finden
        shell: bash
        run: |
          WRAPPER=$(find build-project -name gradlew -type f | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "FEHLER: gradlew wurde nicht gefunden."
            exit 1
          fi

          chmod +x "$WRAPPER"

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle-Projekt: $PROJECT_DIR"

      - name: Debug APK bauen
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: APK finden und umbenennen
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "FEHLER: Keine gebaute APK gefunden."
            exit 1
          fi

          cp "$APK" "Baudetail-${VERSION}.apk"
          echo "APK erstellt: Baudetail-${VERSION}.apk"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Baudetail-${{ env.VERSION }}
          path: Baudetail-${{ env.VERSION }}.apk
          if-no-files-found: error
