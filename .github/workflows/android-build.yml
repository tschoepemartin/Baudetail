name: Android Build 0.3.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'Baudetail-0.3.3-Projekt.zip'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Baudetail project
        run: unzip -q Baudetail-0.3.3-Projekt.zip -d build-src

      - name: Run core tests
        working-directory: build-src/baudetail033-work
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :drawing-core:test --stacktrace

      - name: Build debug APK
        working-directory: build-src/baudetail033-work
        run: |
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baudetail-0.3.3
